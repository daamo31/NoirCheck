name: noircheck
description: "NoirCheck - Plataforma de verificación de autenticidad de contenido digital"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI y navegación
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296
  
  # Networking
  http: ^1.1.0
  dio: ^5.3.2
  
  # State Management
  provider: ^6.0.5
  riverpod: ^2.4.6
  flutter_riverpod: ^2.4.6
  
  # File handling
  file_picker: ^6.1.1
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Image processing
  image: ^4.1.3
  
  # QR y códigos
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  
  # Crypto y Security
  crypto: ^3.0.3
  
  # Utils
  intl: ^0.18.1
  uuid: ^4.1.0
  shared_preferences: ^2.2.2
  
  # UI Components
  flutter_slidable: ^3.0.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  
  # Camera
  camera: ^0.10.5+5
  
  # Permissions
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
